<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Graph Representations Benchmark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient></defs>
<style>
  text { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .title { font-size: 40px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
  .sub { font-size: 17px; fill: #475569; }
  .tag { font-size: 13px; fill: #34D399; font-weight: 700; letter-spacing: 0.4px; }
  .ct { font-size: 13px; font-weight: 700; }
  .nl { font-size: 13px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
  .chip { opacity: 0; animation: up .6s ease-out forwards; }
  .chip:nth-of-type(1) { animation-delay: .2s; } .chip:nth-of-type(2) { animation-delay: .35s; }
  .chip:nth-of-type(3) { animation-delay: .5s; } .chip:nth-of-type(4) { animation-delay: .65s; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes e0 { 0%, 44% { stroke: #CBD5E1; stroke-width: 3; } 48%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e0 { animation: e0 7.0s ease-in-out infinite; }
@keyframes e1 { 0%, 53% { stroke: #CBD5E1; stroke-width: 3; } 57%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e1 { animation: e1 7.0s ease-in-out infinite; }
@keyframes e4 { 0%, 17% { stroke: #CBD5E1; stroke-width: 3; } 21%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e4 { animation: e4 7.0s ease-in-out infinite; }
@keyframes e5 { 0%, 35% { stroke: #CBD5E1; stroke-width: 3; } 39%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e5 { animation: e5 7.0s ease-in-out infinite; }
@keyframes e7 { 0%, 8% { stroke: #CBD5E1; stroke-width: 3; } 12%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e7 { animation: e7 7.0s ease-in-out infinite; }
@keyframes e9 { 0%, 26% { stroke: #CBD5E1; stroke-width: 3; } 30%, 86% { stroke: #34D399; stroke-width: 6; } 94%, 100% { stroke: #CBD5E1; stroke-width: 3; } } .e9 { animation: e9 7.0s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chip { opacity: 1; } }
</style>
